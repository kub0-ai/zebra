name: Build and Push

on:
  push:
    branches: [main]
    paths: ['docker/**', 'VERSION', 'TRUST']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write # cosign needs an OIDC token to talk to Rekor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read VERSION
        id: version
        run: |
          set -euo pipefail
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # THE trust boundary of this repo.
      #
      # Zebra ships no PGP signature, so there is no key to allowlist. Instead
      # upstream's SHA256SUMS is signed via Sigstore, and the signature is only
      # meaningful if we pin WHO signed it: the exact workflow file, in the exact
      # repo, at the exact tag. That identity template lives in ./TRUST.
      #
      # cosign verify-blob fails closed on identity mismatch, so a SHA256SUMS
      # signed by any other workflow -- or for any other release -- is rejected
      # here rather than becoming a build-arg.
      - name: Verify upstream SHA256SUMS via Sigstore
        id: verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/ZcashFoundation/zebra/releases/download/v${VERSION}"
          curl -sSLfo SHA256SUMS               "${BASE}/SHA256SUMS"
          curl -sSLfo SHA256SUMS.sigstore.json "${BASE}/SHA256SUMS.sigstore.json"

          ISSUER=$(sed -n 's/^oidc_issuer=//p' TRUST)
          IDENTITY=$(sed -n 's/^identity=//p' TRUST | sed "s/\${VERSION}/${VERSION}/g")
          echo "pinned issuer:   ${ISSUER}"
          echo "pinned identity: ${IDENTITY}"
          [ -n "${ISSUER}" ] && [ -n "${IDENTITY}" ] || { echo "ERROR: TRUST did not yield an issuer/identity"; exit 1; }

          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-oidc-issuer "${ISSUER}" \
            --certificate-identity    "${IDENTITY}"

          # Pull the per-platform digests out of the now-trusted SHA256SUMS.
          # Herestrings, never `... | grep ...` under pipefail -- see the note in
          # docker/docker-entrypoint.sh.
          AMD64=$(awk -v f="zebrad-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"  '$2==f {print $1}' SHA256SUMS)
          ARM64=$(awk -v f="zebrad-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" '$2==f {print $1}' SHA256SUMS)
          for v in "$AMD64" "$ARM64"; do
            case "$v" in
              [0-9a-f]*) [ ${#v} -eq 64 ] || { echo "ERROR: malformed digest '$v'"; exit 1; } ;;
              *) echo "ERROR: missing digest for v${VERSION} in signed SHA256SUMS"; exit 1 ;;
            esac
          done
          echo "amd64=$AMD64" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"

          {
            echo "### Sigstore verification — **passed**"
            echo ""
            echo "\`SHA256SUMS\` for \`v${VERSION}\` verified against:"
            echo ""
            echo "- issuer \`${ISSUER}\`"
            echo "- identity \`${IDENTITY}\`"
            echo ""
            echo "| platform | sha256 |"
            echo "|---|---|"
            echo "| linux/amd64 | \`${AMD64}\` |"
            echo "| linux/arm64 | \`${ARM64}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 into the local daemon FIRST and prove the image actually
      # starts, before anything is published. v6.3.0 was pushed, tagged and
      # deployed while being dead on arrival: the Dockerfile set ZEBRA_VERSION /
      # ZEBRA_CACHE_DIR / ZEBRA_CONF as image metadata, zebrad parses any
      # ZEBRA_<X> env var as top-level config field <x>, and an unknown field is
      # fatal -- so every container exited 1 with `unknown field version`.
      # The only in-image check was `zebrad --version`, which does not load
      # config and therefore passed. Publishing an unstarted image is the
      # defect this ordering removes.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            ZEBRAD_SHA256_AMD64=${{ steps.verify.outputs.amd64 }}
            ZEBRAD_SHA256_ARM64=${{ steps.verify.outputs.arm64 }}
          tags: zebra:smoke
          cache-from: type=registry,ref=ghcr.io/kub0-ai/zebra:buildcache

      - name: Smoke test — the image must reach startup, and the check must be able to fail
        run: |
          set -euo pipefail

          mkdir -p /tmp/zc
          cat > /tmp/zc/zebrad.toml <<'TOML'
          [network]
          network = "Mainnet"
          [state]
          cache_dir = "/var/cache/zebrad"
          [health]
          listen_addr = "0.0.0.0:8080"
          [metrics]
          endpoint_addr = "0.0.0.0:9999"
          TOML

          # Runs the REAL entrypoint (no --entrypoint override): the config
          # injection, the chown and the gosu drop are all part of what is under
          # test. $1 is passed straight through so the canary can add -e.
          run_node() {
            local cid logs
            cid=$(docker run -d "$@" \
              -v /tmp/zc/zebrad.toml:/etc/zebrad/zebrad.toml:ro \
              zebra:smoke)
            sleep 25
            logs=$(docker logs "$cid" 2>&1 || true)
            docker rm -f "$cid" >/dev/null 2>&1 || true
            printf '%s' "$logs"
          }

          # NOTE: `<<<` and not a pipe. Under `set -o pipefail` a
          # `CMD | grep -q PAT` returns 141 (SIGPIPE) when PAT *matches*,
          # inverting the test on exactly the input it exists to catch. A here-
          # string is a redirect, not a pipeline, so it is immune.
          have() { grep -qF "$1" <<< "$2"; }

          echo "::group::A — the shipped image must start"
          A=$(run_node)
          echo "$A" | head -25
          echo "::endgroup::"

          if have 'unknown field' "$A"; then
            echo "FAIL: zebrad rejected its configuration."
            echo "      Almost certainly a ZEBRA_*-prefixed variable in the"
            echo "      Dockerfile or entrypoint being parsed as a config field."
            grep -F 'unknown field' <<< "$A" | head -3
            exit 1
          fi
          if ! have 'Thank you for running' "$A"; then
            echo "FAIL: zebrad never reached its startup banner in 25s."
            exit 1
          fi
          echo "PASS: image starts and loads its config."

          # A green check that CANNOT go red proves nothing. Inject a variable in
          # zebrad's config namespace and require the assertion above to trip on
          # it. If this canary starts cleanly, the guard has stopped working --
          # fail the build rather than publish behind a decorative test.
          echo "::group::B — canary: ZEBRA_SMOKECANARY must break startup"
          B=$(run_node -e ZEBRA_SMOKECANARY=1)
          echo "$B" | head -10
          echo "::endgroup::"

          if ! have 'unknown field' "$B"; then
            echo "FAIL: canary did not trip. A ZEBRA_-prefixed env var no longer"
            echo "      breaks config parsing, so check A can no longer detect"
            echo "      the regression it exists for. Re-derive the guard before"
            echo "      publishing."
            exit 1
          fi
          echo "PASS: canary tripped — check A is live."

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            ZEBRAD_SHA256_AMD64=${{ steps.verify.outputs.amd64 }}
            ZEBRAD_SHA256_ARM64=${{ steps.verify.outputs.arm64 }}
          tags: |
            ghcr.io/kub0-ai/zebra:${{ steps.version.outputs.version }}
            ghcr.io/kub0-ai/zebra:latest
          cache-from: type=registry,ref=ghcr.io/kub0-ai/zebra:buildcache
          cache-to: type=registry,ref=ghcr.io/kub0-ai/zebra:buildcache,mode=max

      - name: Create git tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Zebra ${{ steps.version.outputs.version }}" || true
          git push origin "v${{ steps.version.outputs.version }}" || true
